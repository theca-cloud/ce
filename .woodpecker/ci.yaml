# The checks, on every branch and pull request, when something built or tested
# changed; manual runs always. The smoke test (scripts/ci.sh) on a real Docker
# daemon: it builds the very Dockerfile that is published, for the agent's
# platform only (amd64, native: minutes). rc.yaml builds amd64 too, release.yaml
# both platforms.
when:
  - event: [push, pull_request]
    # Nothing built or tested changed: docs, local-only scripts, the release
    # pipeline, repo housekeeping. Not rc.yaml: it waits on these checks, so a
    # change to it alone would start nothing.
    path:
      exclude: ["**/*.md", "docs/**", "roadmap/**", "LICENSE", ".gitignore", "cliff.toml", ".githooks/**", "scripts/install-hooks.sh", "scripts/release.sh", ".woodpecker/release.yaml"]
    # Not a version commit (scripts/release.sh, `1.2.3`): it only bumps the
    # version on code dev already tested, on prod and coming back into dev.
    evaluate: 'not (trim(CI_COMMIT_MESSAGE) matches "^[0-9]+[.][0-9]+[.][0-9]+$")'
  - event: manual

# A fixed workspace path: the daemon bind-mounts the smoke test's secret files
# from it, at the path the smoke step wrote them.
workspace:
  base: /woodpecker
  path: src

steps:
  # The Docker daemon, in the background for the rest of the pipeline. A
  # detached step, not a service: steps share the workspace, services don't.
  # Privileged: the repository is trusted in Woodpecker.
  - name: docker
    image: docker:29-dind
    privileged: true
    detach: true
    depends_on: []
    environment:
      # Plain TCP inside the pipeline's network.
      DOCKER_TLS_CERTDIR: ""

  - name: smoke
    image: docker:29-cli
    pull: true
    depends_on: [docker]
    environment:
      DOCKER_HOST: tcp://docker:2375
      # Where the instance's published port is reached: the daemon's host.
      SMOKE_HOST: docker
    commands:
      - apk add -q curl jq openssl git
      - until docker info >/dev/null 2>&1; do sleep 1; done
      - scripts/ci.sh
