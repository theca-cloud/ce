# Authelia as Theca's OIDC provider, on top of docker-compose.yml and a proxy
# example (it needs its own HTTPS address, AUTH_DOMAIN):
#   docker compose -f docker-compose.yml -f compose.caddy.yml -f compose.authelia.yml up -d
# This file, authelia.yml and users.yml go next to docker-compose.yml; the
# secrets in ./secrets/ (README.md).
services:
  authelia:
    image: authelia/authelia:4.39
    restart: unless-stopped
    environment:
      X_AUTHELIA_CONFIG: /config/authelia.yml
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTH_DOMAIN: "${AUTH_DOMAIN:?Authelia's address (auth.example.com), set it in .env}"
      OIDC_CALLBACK: "${OIDC_CALLBACK:?the callback URL Theca shows for the provider, set it in .env}"
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/authelia_session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/authelia_storage_key
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /run/secrets/authelia_oidc_hmac
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/authelia_reset_jwt
    secrets:
      - authelia_session_secret
      - authelia_storage_key
      - authelia_oidc_hmac
      - authelia_reset_jwt
      - authelia_jwks_key
      - oidc_client_secret_hash
    volumes:
      - ./authelia.yml:/config/authelia.yml:ro
      - ./users.yml:/config/users.yml:ro
      - authelia:/var/lib/authelia

  theca:
    # The provider's client secret file in Theca: /run/secrets/oidc_client_secret.
    secrets: [oidc_client_secret]

secrets:
  authelia_session_secret:
    file: ./secrets/authelia_session_secret
  authelia_storage_key:
    file: ./secrets/authelia_storage_key
  authelia_oidc_hmac:
    file: ./secrets/authelia_oidc_hmac
  authelia_reset_jwt:
    file: ./secrets/authelia_reset_jwt
  authelia_jwks_key:
    file: ./secrets/authelia_jwks_key
  oidc_client_secret:
    file: ./secrets/oidc_client_secret
  oidc_client_secret_hash:
    file: ./secrets/oidc_client_secret_hash

volumes:
  authelia:
