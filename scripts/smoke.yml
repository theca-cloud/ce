# The smoke test's changes to docker-compose.yml (scripts/smoke.sh runs both):
# only what a test must change; the rest is the shipped file's.
services:
  postgres:
    healthcheck:
      interval: 2s
      retries: 30

  theca:
    # The image just built.
    image: theca-ce:smoke
    environment:
      # smoke.sh sets the instance up through the API.
      SETUP_OPEN: "true"
    ports: !override
      - ${SMOKE_BIND}:${SMOKE_PORT}:8080
    # The image's check, more often: --wait returns sooner.
    healthcheck:
      interval: 2s
      retries: 30

# In the workspace: a remote daemon (CI) finds them at the same path.
secrets:
  postgres_password:
    file: ${SMOKE_DIR}/postgres_password
  database_url:
    file: ${SMOKE_DIR}/database_url
  server.key:
    file: ${SMOKE_DIR}/server.key
  data.key:
    file: ${SMOKE_DIR}/data.key
